<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工程师学习计划</title>
<style>
:root {
  --bg: #09090b;
  --bg-card: #111118;
  --bg-card-hover: #16161f;
  --bg-sidebar: #0c0c10;
  --bg-hover: #1a1a26;
  --bg-elevated: #1e1e2a;
  --text: #e8e8ed;
  --text-dim: #9090a8;
  --text-muted: #55556a;
  --border: #1f1f2e;
  --border-hover: #2e2e44;
  --accent-1: #6366f1;
  --accent-1-glow: rgba(99,102,241,0.15);
  --accent-2: #a855f7;
  --accent-2-glow: rgba(168,85,247,0.12);
  --accent-3: #f59e0b;
  --accent-3-glow: rgba(245,158,11,0.10);
  --accent-4: #22c55e;
  --accent-4-glow: rgba(34,197,94,0.10);
  --progress-grad: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
  --phase1: #6366f1;
  --phase2: #a855f7;
  --phase3: #f59e0b;
  --phase4: #22c55e;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 24px rgba(99,102,241,0.08);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-w: 272px;
}
/* ===== LIGHT THEME ===== */
body.light {
  --bg: #f5f5f7;
  --bg-card: #ffffff;
  --bg-card-hover: #fafafa;
  --bg-sidebar: #f0f0f3;
  --bg-hover: #ececf0;
  --bg-elevated: #e8e8ed;
  --text: #1a1a2e;
  --text-dim: #6b6b80;
  --text-muted: #a0a0b0;
  --border: #e0e0e8;
  --border-hover: #d0d0dc;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
  --shadow-glow: 0 0 20px rgba(99,102,241,0.06);
}
body.light::before {
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,0.04), transparent),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(168,85,247,0.03), transparent);
}
body.light .checklist li input[type="checkbox"] { background: var(--bg); }
body.light .checklist li input[type="checkbox"]:checked { background: var(--accent-4); }
body.light .modal-body .tip-box { background: rgba(34,197,94,0.08); }
body.light .modal-body .warn-box { background: rgba(245,158,11,0.08); }
body.light .mobile-toggle { box-shadow: 0 4px 16px rgba(99,102,241,0.3); }
body.light .nav-item .nav-progress { background: rgba(0,0,0,0.05); }
body.light .global-progress .bar-bg { background: rgba(0,0,0,0.06); }
body.light .week-progress-text { background: rgba(0,0,0,0.05); }

/* Theme toggle button */
.theme-toggle {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 6px 12px;
  font-size: 16px;
  cursor: pointer;
  transition: all var(--transition);
  color: var(--text);
}
.theme-toggle:hover {
  background: rgba(255,255,255,0.12);
  border-color: var(--border-hover);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  display: flex;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
/* Subtle background texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,0.06), transparent),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(168,85,247,0.04), transparent);
  pointer-events: none;
  z-index: 0;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 0;
  z-index: 100;
  transition: transform var(--transition-slow);
}
.sidebar-header {
  padding: 28px 22px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(99,102,241,0.04) 0%, transparent 100%);
}
.sidebar-header h2 {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
  letter-spacing: -0.01em;
}
.sidebar-header .subtitle {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}
.nav-section {
  padding: 16px 22px 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 22px 7px 22px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
  border-left: 2px solid transparent;
  position: relative;
}
.nav-item:hover {
  background: var(--bg-hover);
  color: var(--text);
}
.nav-item.active {
  color: #fff;
  background: rgba(99,102,241,0.08);
  border-left-color: var(--accent-1);
}
.nav-item .nav-progress {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  background: rgba(255,255,255,0.04);
  padding: 2px 7px;
  border-radius: 10px;
  min-width: 28px;
  text-align: center;
}
.nav-phase { font-weight: 600; }

/* ===== MAIN ===== */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 0;
  min-width: 0;
  position: relative;
  z-index: 1;
}

/* ===== TOP BAR ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border-bottom: 1px solid var(--border);
  padding: 14px 36px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.global-progress {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 14px;
}
.global-progress .bar-bg {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.04);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.global-progress .bar-fill {
  height: 100%;
  background: var(--progress-grad);
  border-radius: 3px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  box-shadow: 0 0 12px rgba(99,102,241,0.3);
}
.global-progress .label {
  font-size: 13px;
  font-weight: 700;
  background: var(--progress-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  min-width: 38px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.date-picker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
}
.date-picker input {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 5px 10px;
  border-radius: var(--radius-xs);
  font-size: 12px;
  width: 130px;
  transition: border-color var(--transition);
  outline: none;
}
.date-picker input:focus {
  border-color: var(--accent-1);
}
.topbar-actions {
  display: flex;
  gap: 6px;
}
.topbar-actions button {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 6px 12px;
  border-radius: var(--radius-xs);
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
  font-weight: 500;
}
.topbar-actions button:hover {
  background: rgba(255,255,255,0.08);
  color: var(--text);
  border-color: var(--border-hover);
}

/* ===== CONTENT ===== */
.content {
  max-width: 880px;
  margin: 0 auto;
  padding: 36px 36px 100px;
}

/* ===== HERO ===== */
.hero {
  text-align: center;
  padding: 56px 0 48px;
  position: relative;
}
.hero h1 {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 10px;
  background: var(--progress-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.02em;
  line-height: 1.3;
}
.hero .meta {
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 32px;
  letter-spacing: 0.01em;
}
.hero .stats {
  display: flex;
  justify-content: center;
  gap: 0;
}
.hero .stat {
  text-align: center;
  padding: 0 28px;
  position: relative;
}
.hero .stat:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: 32px;
  background: var(--border);
}
.hero .stat-num {
  font-size: 26px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.hero .stat-num:nth-child(1) { color: var(--accent-1); }
.hero .stat-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  margin-top: 2px;
}

/* ===== PHASE ===== */
.phase {
  margin-bottom: 48px;
}
.phase-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
  padding: 18px 22px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  transition: all var(--transition);
}
.phase-header:hover {
  border-color: var(--border-hover);
  box-shadow: var(--shadow-sm);
}
.phase-badge {
  width: 3px;
  height: 40px;
  border-radius: 2px;
  flex-shrink: 0;
  opacity: 0.9;
}
.phase-header h2 {
  font-size: 17px;
  font-weight: 700;
  flex: 1;
  letter-spacing: -0.01em;
}
.phase-header .phase-progress {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.phase-header .phase-bar {
  width: 88px;
  height: 5px;
  background: rgba(255,255,255,0.04);
  border-radius: 3px;
  overflow: hidden;
}
.phase-header .phase-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}
.phase-desc {
  padding: 14px 22px;
  margin-bottom: 18px;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border-hover);
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.8;
}
.phase-desc strong { color: var(--text); }

/* ===== WEEK CARD ===== */
.week-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 14px;
  overflow: hidden;
  transition: all var(--transition-slow);
}
.week-card:hover {
  border-color: var(--border-hover);
  box-shadow: var(--shadow-sm);
}
.week-card.current-week {
  border-color: var(--accent-1);
  box-shadow: 0 0 0 1px rgba(99,102,241,0.2), var(--shadow-glow);
}
.week-card.current-week .week-num {
  background: var(--accent-1);
  border-color: var(--accent-1);
  color: #fff;
}
.week-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 22px;
  cursor: pointer;
  user-select: none;
  transition: background var(--transition);
}
.week-header:hover { background: rgba(255,255,255,0.02); }
.week-num {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
  border: 1.5px solid var(--border-hover);
  transition: all var(--transition);
  font-variant-numeric: tabular-nums;
}
.week-card.completed .week-num {
  background: var(--accent-4);
  border-color: var(--accent-4);
  color: #fff;
}
.week-title {
  font-size: 15px;
  font-weight: 600;
  flex: 1;
  letter-spacing: -0.01em;
}
.week-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}
.week-date {
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.week-progress-text {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  background: rgba(255,255,255,0.04);
  padding: 3px 9px;
  border-radius: 10px;
  font-variant-numeric: tabular-nums;
}
.week-chevron {
  font-size: 12px;
  color: var(--text-muted);
  transition: transform var(--transition);
  opacity: 0.5;
}
.week-card.open .week-chevron {
  transform: rotate(90deg);
  opacity: 1;
}

.week-body {
  display: none;
  padding: 4px 22px 22px;
}
.week-card.open .week-body { display: block; }

/* ===== SECTIONS IN WEEK ===== */
.section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* ===== CHECKLIST ===== */
.checklist {
  list-style: none;
}
.checklist li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 10px;
  margin: 2px 0;
  font-size: 13.5px;
  color: var(--text);
  cursor: pointer;
  transition: all var(--transition);
  border-radius: var(--radius-xs);
}
.checklist li:hover { background: rgba(255,255,255,0.02); }
.checklist li input[type="checkbox"] {
  appearance: none;
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--border-hover);
  border-radius: 5px;
  flex-shrink: 0;
  margin-top: 3px;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  background: rgba(255,255,255,0.02);
}
.checklist li input[type="checkbox"]:hover {
  border-color: var(--accent-4);
  background: rgba(34,197,94,0.06);
}
.checklist li input[type="checkbox"]:checked {
  background: var(--accent-4);
  border-color: var(--accent-4);
  box-shadow: 0 0 8px rgba(34,197,94,0.2);
}
.checklist li input[type="checkbox"]:checked::after {
  content: "✓";
  position: absolute;
  top: -1px; left: 3px;
  font-size: 12px;
  color: #fff;
  font-weight: 800;
}
.checklist li.done {
  text-decoration: line-through;
  color: var(--text-muted);
  opacity: 0.7;
}

/* ===== DETAIL BLOCKS ===== */
.detail-block {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin: 10px 0;
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-dim);
}
.detail-block strong { color: var(--text); }
.detail-block code {
  background: rgba(99,102,241,0.08);
  padding: 1.5px 6px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--accent-1);
  font-weight: 500;
}
.detail-block ol, .detail-block ul {
  padding-left: 18px;
  margin: 4px 0;
}
.detail-block li { margin: 3px 0; }
.detail-block pre {
  background: rgba(0,0,0,0.4);
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 10px 0;
  font-size: 12.5px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  line-height: 1.65;
  font-family: "SF Mono", "Fira Code", "JetBrains Mono", monospace;
}

/* ===== TIMER ===== */
.timer-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
  padding: 12px 16px;
  background: rgba(255,255,255,0.02);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.timer-display {
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  min-width: 80px;
  background: var(--progress-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.02em;
}
.timer-btn {
  padding: 5px 14px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
  font-weight: 500;
}
.timer-btn:hover {
  background: rgba(255,255,255,0.08);
  border-color: var(--border-hover);
}
.timer-btn.primary {
  background: var(--accent-1);
  border-color: var(--accent-1);
  color: #fff;
  box-shadow: 0 0 12px rgba(99,102,241,0.2);
}
.timer-btn.primary:hover { opacity: 0.85; box-shadow: 0 0 16px rgba(99,102,241,0.3); }
.timer-total {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}

/* ===== NOTES ===== */
.notes-area {
  width: 100%;
  min-height: 80px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  padding: 12px 14px;
  resize: vertical;
  font-family: inherit;
  line-height: 1.7;
  margin-top: 4px;
  transition: all var(--transition);
}
.notes-area:focus {
  outline: none;
  border-color: var(--accent-1);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.08);
}
.notes-area::placeholder { color: var(--text-muted); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(8px) saturate(0.8);
  -webkit-backdrop-filter: blur(8px) saturate(0.8);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s cubic-bezier(0.4,0,0.2,1);
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border-hover);
  border-radius: 16px;
  width: 90%;
  max-width: 720px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
  transform: translateY(24px) scale(0.96);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-header .modal-icon {
  width: 38px; height: 38px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.modal-header h3 {
  font-size: 16px;
  font-weight: 700;
  flex: 1;
  letter-spacing: -0.01em;
}
.modal-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.modal-close:hover {
  background: rgba(255,255,255,0.06);
  color: var(--text);
  border-color: var(--border-hover);
}
.modal-body {
  padding: 24px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-dim);
}
.modal-body h4 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin: 22px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);

<li><strong>OpenAI text-embedding-3-small：</strong>简单好用，按量付费，维度 1536</li>
<li><strong>BGE-M3（开源）：</strong>支持多语言、多粒度，可本地部署，免费</li>
<li><strong>Jina Embeddings v3：</strong>长文本能力强，有免费额度</li>
</ul></div>
<div class="detail-block"><strong>2. 相似度计算</strong>
<ul>
<li><strong>余弦相似度（Cosine）：</strong>最常用，只看方向不看大小</li>
<li><strong>欧氏距离（Euclidean）：</strong>看绝对距离，对向量长度敏感</li>
<li><strong>内积（Dot Product）：</strong>计算最快，但要注意向量是否已归一化</li>
</ul></div>
<div class="detail-block"><strong>3. 向量数据库选型</strong>
<ul>
<li><strong>ChromaDB：</strong>最简单的入门选择，纯 Python，嵌入式，学习和原型阶段首选</li>
<li><strong>FAISS：</strong>Meta 开源，性能极强，适合大规模数据，但只是索引不是数据库</li>
<li><strong>PGVector（⭐ 企业首选）：</strong>PostgreSQL 的向量扩展，业务数据和向量数据存在一起
<pre>-- 安装
CREATE EXTENSION vector;

-- 创建带向量列的表
CREATE TABLE documents (
    id SERIAL PRIMARY KEY,
    content TEXT,
    metadata JSONB,
    embedding vector(1536)    -- OpenAI embedding 维度
);

-- 创建 HNSW 索引
CREATE INDEX ON documents USING hnsw (embedding vector_cosine_ops);

-- 混合检索：向量 + 业务字段
SELECT *, 1 - (embedding <=> query_vector) AS similarity
FROM documents
WHERE metadata->>'source' = 'handbook'
ORDER BY embedding <=> query_vector
LIMIT 5;</pre>
为什么选 PGVector：不用额外运维一个向量库，事务一致，可做真正的业务+向量混合查询</li>
<li>其他生产级：Pinecone（托管）、Qdrant、Weaviate、Milvus（自建）</li>
</ul></div>
<div class="detail-block"><strong>4. 分块策略（Chunking）</strong>
<ul>
<li><strong>固定长度切分：</strong>按 token 数或字数切，简单但可能切断语义</li>
<li><strong>语义切分：</strong>按段落、标题、句子边界切，保留语义完整性</li>
<li><strong>重叠窗口：</strong>相邻块之间重叠 10-20%，避免边界信息丢失</li>
<li>分块大小建议：500-1500 token</li>
</ul></div>`,

<h4>成本追踪实现</h4>
<pre>import time
from dataclasses import dataclass

@dataclass
class CallRecord:
    model: str
    input_tokens: int
    output_tokens: int
    latency_ms: float
    cost_usd: float

# 价格表（每 1M tokens）
PRICING = {
    "gpt-4o":           {"input": 2.50,  "output": 10.00},
    "gpt-4o-mini":      {"input": 0.15,  "output": 0.60},
    "claude-sonnet-4-20250514": {"input": 3.00, "output": 15.00},
    "claude-haiku":     {"input": 0.25,  "output": 1.25},
}

def calc_cost(model, input_tok, output_tok):
    p = PRICING.get(model, {"input": 0, "output": 0})
    return (input_tok * p["input"] + output_tok * p["output"]) / 1_000_000

# 使用示例
start = time.time()
response = client.chat.completions.create(...)
latency = (time.time() - start) * 1000

record = CallRecord(

        response.usage.prompt_tokens,

)</pre>

<h4>示例：简单 Agent</h4>

class AgentState(TypedDict):
    messages: list

    response = model.invoke(state["messages"])

    # 执行工具

    if last.tool_calls:

graph.add_node("tools", call_tool)

graph.add_conditional_edges("model", should_continue)
graph.add_edge("tools", "model")

    const d = new Date(this.startDate);
    d.setDate(d.getDate() + weekIdx * 7);
    const end = new Date(d);
    end.setDate(end.getDate() + 6);
    const fmt = dt => `${dt.getMonth()+1}/${dt.getDate()}`;
    return `${fmt(d)} - ${fmt(end)}`;

    const now = new Date();

    weekStart.setDate(weekStart.getDate() + weekIdx * 7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 7);

    let html = '';
    let weekIdx = 0;
    phases.forEach(p => {
      html += `<div class="nav-section">${p.title.split('：')[0]}</div>`;
      p.weeks.forEach(w => {
        const done = this.countDone(w.id);
        const total = w.tasks.length;
        html += `<a class="nav-item" data-week="${w.id}" href="#${w.id}">
          <span>${w.title.split(' — ')[0]}</span>
          <span class="nav-progress">${done}/${total}</span>
        </a>`;
        weekIdx++;
      });
    });
    nav.innerHTML = html;
  }

  renderContent() {
    const content = document.getElementById('content');
    let html = `<div class="hero">
      <h1>AI 工程师学习计划</h1>
      <div class="meta">大模型应用开发方向 · 12 周 · 从基础到实战</div>
      <div class="stats">
        <div class="stat"><div class="stat-num" id="statDone">0</div><div class="stat-label">已完成</div></div>
        <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总任务</div></div>
        <div class="stat"><div class="stat-num" id="statWeeks">0</div><div class="stat-label">已完成周</div></div>
        <div class="stat"><div class="stat-num" id="statTime">0h</div><div class="stat-label">学习时间</div></div>
      </div>
    </div>`;

    let weekIdx = 0;
    phases.forEach(p => {
      const pTotal = p.weeks.reduce((s, w) => s + w.tasks.length, 0);
      const pDone = p.weeks.reduce((s, w) => s + this.countDone(w.id), 0);
      html += `<div class="phase" id="${p.id}">
        <div class="phase-header">
          <div class="phase-badge" style="background:${p.color}"></div>
          <h2>${p.title}</h2>
          <span class="phase-progress">${pDone}/${pTotal}</span>
          <div class="phase-bar"><div class="phase-bar-fill" style="width:${pTotal?Math.round(pDone/pTotal*100):0}%;background:${p.color}"></div></div>
        </div>
        <div class="phase-desc">${p.desc}</div>`;

      p.weeks.forEach(w => {
        const isOpen = this.openCards[w.id];
        const done = this.countDone(w.id);
        const total = w.tasks.length;
        const isCurrent = this.isCurrentWeek(weekIdx);
        const dateStr = this.getWeekDate(weekIdx);
        const completed = done === total && total > 0;

        html += `<div class="week-card ${isOpen?'open':''} ${isCurrent?'current-week':''} ${completed?'completed':''}" data-week="${w.id}">
          <div class="week-header" data-toggle="${w.id}">
            <div class="week-num">${weekIdx+1}</div>
            <div class="week-title">${w.title}</div>
            <div class="week-meta">
              ${dateStr ? `<span class="week-date" data-weekdate="${weekIdx}">${dateStr}</span>` : ''}
              <span class="week-progress-text">${done}/${total}</span>
              <span class="week-chevron">▶</span>
            </div>
          </div>
          <div class="week-body">
            <div class="section-title">目标</div>
            <p style="font-size:14px;color:var(--text-dim);margin-bottom:8px">${w.goal}</p>
            <div class="section-title">学习清单</div>
            <ul class="checklist">`;

        w.tasks.forEach((t, i) => {
          const key = `${w.id}-${i}`;
          const checked = this.checks[key] ? 'checked' : '';
          const cls = this.checks[key] ? 'done' : '';
          html += `<li class="${cls}"><input type="checkbox" data-key="${key}" ${checked}><span>${t}</span></li>`;
        });

        html += `</ul>`;

        // Study nodes (clickable cards that open modals)
        const nodes = studyNodes[w.id];
        if (nodes && nodes.length) {
          html += `<div class="section-title">深入学习（点击展开）</div><div class="study-nodes">`;
          nodes.forEach((n, i) => {
            html += `<div class="study-node" data-modal="${w.id}-${i}">
              <div class="node-icon" style="background:${n.color}22;color:${n.color}">${n.icon}</div>
              <span class="node-label">${n.label}</span>
              <span class="node-arrow">→</span>
            </div>`;
          });
          html += `</div>`;
        }

        if (w.detail) {
          html += `<div class="section-title">详细内容</div>${w.detail}`;
        }

        if (w.tips) {
          html += `<div class="section-title">建议</div><div class="detail-block" style="border-left-color:var(--accent-4)">${w.tips}</div>`;
        }
        if (w.pitfalls) {
          html += `<div class="section-title">常见坑</div><div class="detail-block" style="border-left-color:var(--accent-3)">${w.pitfalls}</div>`;
        }
        if (w.project) {
          html += `<div class="section-title">实践项目</div><div class="detail-block" style="border-left-color:var(--accent-2)">${w.project}</div>`;
        }

        // Top-tier resources (card style)
        const topRes = topResources[w.id];
        if (topRes && topRes.length) {
          html += `<div class="section-title">权威资料</div><div class="resource-cards">`;
          topRes.forEach(r => {
            html += `<a class="resource-card" href="${r.url}" target="_blank" rel="noopener">
              <div class="rc-info">
                <span class="rc-title">${r.title}</span>
                <span class="rc-desc">${r.desc}</span>
              </div>
              <span class="rc-badge" style="background:${r.badgeColor}18;color:${r.badgeColor};border:1px solid ${r.badgeColor}33">${r.badge}</span>
            </a>`;
          });
          html += `</div>`;
        }

        // Basic resources (inline links)
        if (w.resources && w.resources.length) {
          html += `<div class="section-title">其他资源</div><div class="resource-links">`;
          w.resources.forEach(r => {
            const urlMatch = r.match(/\((https?:\/\/[^)]+)\)/);
            const label = r.replace(/\s*\(https?:\/\/[^)]+\)/, '');
            if (urlMatch) {
              html += `<a class="resource-link" href="${urlMatch[1]}" target="_blank" rel="noopener"> ${label}</a>`;
            } else {
              html += `<span class="resource-link" style="cursor:default"> ${r}</span>`;
            }
          });
          html += `</div>`;
        }

        // Timer
        const timerData = this.timers[w.id] || { total: 0, running: false, start: null };
        const elapsed = timerData.running ? timerData.total + (Date.now() - timerData.start) : timerData.total;
        html += `<div class="section-title">学习计时</div>
          <div class="timer-row">
            <div class="timer-display" data-timer="${w.id}">${this.formatTime(elapsed)}</div>
            <button class="timer-btn primary" data-timer-btn="${w.id}">${timerData.running ? '暂停' : '开始'}</button>
            <button class="timer-btn" data-timer-reset="${w.id}">重置</button>
            <div class="timer-total">累计: ${this.formatTime(timerData.total)}</div>
          </div>`;

        // Notes
        const noteVal = this.notes[w.id] || '';
        html += `<div class="section-title">学习笔记</div>
          <textarea class="notes-area" data-note="${w.id}" placeholder="在这里记录学习笔记、心得、问题...">${noteVal}</textarea>`;

        html += `</div></div>`;
        weekIdx++;
      });

      html += `</div>`;
    });

    content.innerHTML = html;
  }

  countDone(weekId) {
    let count = 0;
    phases.forEach(p => p.weeks.forEach(w => {
      if (w.id === weekId) {
        w.tasks.forEach((_, i) => { if (this.checks[`${w.id}-${i}`]) count++; });
      }
    }));
    return count;
  }

  openModal(node) {
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalIcon').innerHTML = node.icon;
    document.getElementById('modalIcon').style.background = node.color + '22';
    document.getElementById('modalIcon').style.color = node.color;
    document.getElementById('modalTitle').textContent = node.label;
    document.getElementById('modalBody').innerHTML = node.content;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${m}:${String(sec).padStart(2,'0')}`;
  }

  formatTimeShort(ms) {
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    if (h > 0) return `${h}h${m}m`;
    return `${m}m`;
  }

  bindEvents() {
    document.addEventListener('click', e => {
      // Toggle week card
      const header = e.target.closest('[data-toggle]');
      if (header) {
        const wid = header.dataset.toggle;
        this.openCards[wid] = !this.openCards[wid];
        STORE.set('openCards', this.openCards);
        header.closest('.week-card').classList.toggle('open');
        return;
      }

      // Checkbox
      const cb = e.target.closest('input[type="checkbox"][data-key]');
      if (cb) {
        const key = cb.dataset.key;
        this.checks[key] = cb.checked;
        STORE.set('checks', this.checks);
        cb.closest('li').classList.toggle('done', cb.checked);
        this.updateProgress();
        return;
      }

      // Timer button
      const timerBtn = e.target.closest('[data-timer-btn]');
      if (timerBtn) {
        const wid = timerBtn.dataset.timerBtn;
        this.toggleTimer(wid);
        return;
      }

      // Timer reset
      const resetBtn = e.target.closest('[data-timer-reset]');
      if (resetBtn) {
        const wid = resetBtn.dataset.timerReset;
        this.resetTimer(wid);
        return;
      }

      // Nav click
      const navItem = e.target.closest('.nav-item');
      if (navItem) {
        e.preventDefault();
        const wid = navItem.dataset.week;
        const el = document.getElementById(wid);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          // Open the card
          const card = el.closest('.week-card');
          if (card && !card.classList.contains('open')) {
            card.querySelector('[data-toggle]').click();
          }
        }
        // Close mobile sidebar
        document.querySelector('.sidebar').classList.remove('open');
        return;
      }

      // Study node click → open modal
      const node = e.target.closest('.study-node[data-modal]');
      if (node) {
        const [wid, idx] = node.dataset.modal.split('-');
        const nodes = studyNodes[wid];
        if (nodes && nodes[idx]) {
          this.openModal(nodes[idx]);
        }
        return;
      }

      // Modal close
      if (e.target.closest('#modalClose') || e.target.id === 'modalOverlay') {
        this.closeModal();
        return;
      }
    });

    // ESC to close modal
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') this.closeModal();
    });

    // Notes save
    document.addEventListener('input', e => {
      if (e.target.matches('.notes-area')) {
        this.notes[e.target.dataset.note] = e.target.value;
        STORE.set('notes', this.notes);
      }
    });

    // Scroll spy
    window.addEventListener('scroll', () => this.scrollSpy());

    // Timer tick
    setInterval(() => this.tickTimers(), 1000);
  }

  toggleTimer(wid) {
    if (!this.timers[wid]) this.timers[wid] = { total: 0, running: false, start: null };
    const t = this.timers[wid];

    if (t.running) {
      t.total += Date.now() - t.start;
      t.running = false;
      t.start = null;
    } else {
      // Stop other running timers
      Object.keys(this.timers).forEach(k => {
        if (this.timers[k].running) {
          this.timers[k].total += Date.now() - this.timers[k].start;
          this.timers[k].running = false;
          this.timers[k].start = null;
        }
      });
      t.running = true;
      t.start = Date.now();
    }
    STORE.set('timers', this.timers);
    this.updateTimerDisplay(wid);
    // Also update the other timer buttons
    document.querySelectorAll('[data-timer-btn]').forEach(btn => {
      const k = btn.dataset.timerBtn;
      const td = this.timers[k] || { running: false };
      btn.textContent = td.running ? '暂停' : '开始';
    });
  }

  resetTimer(wid) {
    this.timers[wid] = { total: 0, running: false, start: null };
    STORE.set('timers', this.timers);
    this.updateTimerDisplay(wid);
    this.updateStats();
  }

  updateTimerDisplay(wid) {
    const t = this.timers[wid] || { total: 0, running: false, start: null };
    const elapsed = t.running ? t.total + (Date.now() - t.start) : t.total;
    const display = document.querySelector(`[data-timer="${wid}"]`);
    if (display) display.textContent = this.formatTime(elapsed);
    const btn = document.querySelector(`[data-timer-btn="${wid}"]`);
    if (btn) btn.textContent = t.running ? '暂停' : '开始';
  }

  tickTimers() {
    Object.keys(this.timers).forEach(wid => {
      if (this.timers[wid].running) {
        this.updateTimerDisplay(wid);
      }
    });
  }

  scrollSpy() {
    const sections = document.querySelectorAll('.week-card');
    let current = '';
    sections.forEach(s => {
      const rect = s.getBoundingClientRect();
      if (rect.top <= 120) current = s.dataset.week;
    });
    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.week === current);
    });
  }

  updateProgress() {
    let totalTasks = 0, doneTasks = 0, totalMs = 0, weeksDone = 0;
    phases.forEach(p => p.weeks.forEach(w => {
      totalTasks += w.tasks.length;
      doneTasks += this.countDone(w.id);
      const t = this.timers[w.id];
      if (t) totalMs += t.total + (t.running ? Date.now() - t.start : 0);
      if (this.countDone(w.id) === w.tasks.length && w.tasks.length > 0) weeksDone++;
    }));

    const pct = totalTasks ? Math.round(doneTasks / totalTasks * 100) : 0;
    document.getElementById('globalBar').style.width = pct + '%';
    document.getElementById('globalLabel').textContent = pct + '%';
    document.getElementById('statDone').textContent = doneTasks;
    document.getElementById('statTotal').textContent = totalTasks;
    document.getElementById('statWeeks').textContent = weeksDone;
    document.getElementById('statTime').textContent = this.formatTimeShort(totalMs);

    // Update nav
    this.renderNav();

    // Update week progress text and phase progress
    let weekIdx = 0;
    phases.forEach(p => {
      const phaseEl = document.querySelector(`[data-phase-progress="${p.id}"]`);
      let pDone = 0, pTotal = 0;
      p.weeks.forEach(w => {
        const done = this.countDone(w.id);
        const total = w.tasks.length;
        pDone += done;
        pTotal += total;
        const card = document.querySelector(`.week-card[data-week="${w.id}"]`);
        if (card) {
          const pt = card.querySelector('.week-progress-text');
          if (pt) pt.textContent = `${done}/${total}`;
          card.classList.toggle('completed', done === total && total > 0);
        }
        weekIdx++;
      });
    });

    // Update phase progress
    document.querySelectorAll('.phase').forEach(phaseEl => {
      const pid = phaseEl.id;
      const phase = phases.find(p => p.id === pid);
      if (!phase) return;
      let pDone = 0, pTotal = 0;
      phase.weeks.forEach(w => {
        pDone += this.countDone(w.id);
        pTotal += w.tasks.length;
      });
      const pp = phaseEl.querySelector('.phase-progress');
      const pbf = phaseEl.querySelector('.phase-bar-fill');
      if (pp) pp.textContent = `${pDone}/${pTotal}`;
      if (pbf) pbf.style.width = (pTotal ? Math.round(pDone/pTotal*100) : 0) + '%';
    });
  }

  updateDates() {
    if (!this.startDate) return;
    let weekIdx = 0;
    phases.forEach(p => p.weeks.forEach(w => {
      const dateEl = document.querySelector(`[data-weekdate="${weekIdx}"]`);
      if (dateEl) dateEl.textContent = this.getWeekDate(weekIdx);
      const card = document.querySelector(`.week-card[data-week="${w.id}"]`);
      if (card) {
        card.classList.toggle('current-week', this.isCurrentWeek(weekIdx));
      }
      weekIdx++;
    }));
  }

  expandAll() {
    document.querySelectorAll('.week-card').forEach(c => {
      c.classList.add('open');
      this.openCards[c.dataset.week] = true;
    });
    STORE.set('openCards', this.openCards);
  }

  collapseAll() {
    document.querySelectorAll('.week-card').forEach(c => {
      c.classList.remove('open');
      this.openCards[c.dataset.week] = false;
    });
    STORE.set('openCards', this.openCards);
  }

  resetAll() {
    if (!confirm('确定要重置所有进度吗？此操作不可撤销。')) return;
    this.checks = {};
    this.timers = {};
    this.notes = {};
    this.openCards = {};
    STORE.set('checks', {});
    STORE.set('timers', {});
    STORE.set('notes', {});
    STORE.set('openCards', {});
    this.renderContent();
    this.updateProgress();
  }
}

const app = new App();
</script>
</body>
</html>
